<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - DUSK Roleplay</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="site-header glass-effect">
        <div class="logo">
            <a href="index.html"><img src="img/banner2.png" alt="DUSK Logo"></a>
        </div>
        <div class="header-info">
            <div class="info-item status-online">🟢 IP: play.dusk-mc.com</div>
            <div class="info-item">👥 Online: 150/200</div>
        </div>
    </header>

    <nav class="main-nav glass-effect">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">หน้าหลัก</a></li>
                <li><a href="about.html">เกี่ยวกับเรา</a></li>
                <li><a href="https://docs.google.com/spreadsheets/d/1b8XUzjg0LRW1eghqyFfw-edwqzgakyKf_25sZq3WD0U/edit?usp=sharing">กฎเซิร์ฟเวอร์</a></li>
                <li><a href="team.html">ทีมงาน</a></li>
                <li><a href="chat.html">แชทบอท</a></li>
            </ul>
            <div id="auth-nav-slot"></div>
        </div>
    </nav>

    <div class="auth-page-wrap">
        <div class="auth-box glass-effect">

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">เข้าสู่ระบบ</button>
                <button class="auth-tab" data-tab="register">สมัครสมาชิก</button>
            </div>

            <p id="auth-error" class="auth-error"></p>
            <p id="auth-success" class="auth-success"></p>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form id="login-form" class="auth-form">
                <label>อีเมล</label>
                <input type="email" id="login-email" required placeholder="example@email.com">

                <label>รหัสผ่าน</label>
                <input type="password" id="login-password" required placeholder="••••••••">

                <button type="submit" class="btn-glow auth-submit-btn">เข้าสู่ระบบ</button>
            </form>

            <!-- ฟอร์มสมัครสมาชิก -->
            <form id="register-form" class="auth-form" style="display:none;">
                <label>ชื่อผู้เล่น (Username)</label>
                <input type="text" id="register-username" required placeholder="ชื่อในเกม">

                <label>อีเมล</label>
                <input type="email" id="register-email" required placeholder="example@email.com">

                <label>รหัสผ่าน</label>
                <input type="password" id="register-password" required placeholder="อย่างน้อย 6 ตัวอักษร">

                <button type="submit" class="btn-glow auth-submit-btn">สมัครสมาชิก</button>
            </form>

        </div>
    </div>

    <footer class="site-footer glass-effect">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>DUSK <span>Community</span></h3>
                <p>สัมผัสประสบการณ์ Roleplay ที่ดีที่สุด</p>
            </div>
            <div class="footer-links">
                <a href="#">เงื่อนไขการให้บริการ</a>
                <a href="#">นโยบายความเป็นส่วนตัว</a>
                <a href="#">ติดต่อทีมงาน</a>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 DUSK Project MC JAVA Roleplay. All Rights Reserved.
        </div>
    </footer>

    <!-- Firebase SDK (compat version - ไม่ต้องใช้ build tool) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        const tabs = document.querySelectorAll(".auth-tab");
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const errorBox = document.getElementById("auth-error");
        const successBox = document.getElementById("auth-success");

        function clearMessages() {
            errorBox.textContent = "";
            successBox.textContent = "";
        }

        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                clearMessages();
                if (tab.dataset.tab === "login") {
                    loginForm.style.display = "flex";
                    registerForm.style.display = "none";
                } else {
                    loginForm.style.display = "none";
                    registerForm.style.display = "flex";
                }
            });
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearMessages();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            const btn = loginForm.querySelector("button");
            btn.disabled = true;
            btn.textContent = "กำลังเข้าสู่ระบบ...";

            const result = await loginUser(email, password);

            btn.disabled = false;
            btn.textContent = "เข้าสู่ระบบ";

            if (result.success) {
                successBox.textContent = "เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้าหลัก...";
                setTimeout(() => window.location.href = "index.html", 1000);
            } else {
                errorBox.textContent = result.message;
            }
        });

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearMessages();
            const username = document.getElementById("register-username").value;
            const email = document.getElementById("register-email").value;
            const password = document.getElementById("register-password").value;

            const btn = registerForm.querySelector("button");
            btn.disabled = true;
            btn.textContent = "กำลังสมัคร...";

            const result = await registerUser(username, email, password);

            btn.disabled = false;
            btn.textContent = "สมัครสมาชิก";

            if (result.success) {
                successBox.textContent = "สมัครสมาชิกสำเร็จ! กำลังพาไปหน้าหลัก...";
                setTimeout(() => window.location.href = "index.html", 1000);
            } else {
                errorBox.textContent = result.message;
            }
        });
    </script>
</body>
</html>
